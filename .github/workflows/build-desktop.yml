name: Build Desktop Apps

on:
  workflow_dispatch:          # manual trigger from GitHub UI
  push:
    tags:
      - 'v*'                  # auto-build on version tags like v1.0.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the pnpm version pinned in package.json's "packageManager" field
      # (pnpm@11.5.0 — 10.x has a resolver bug with @napi-rs/canvas optional deps).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # supportedArchitectures (pnpm-workspace.yaml) makes this single install
      # fetch the canvas binaries for both macOS arches (and win32), so no extra
      # per-arch install step is needed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js standalone
        run: npx cross-env NEXT_PUBLIC_ENABLE_SAVE=true next build

      - name: Prepare standalone directory
        run: node build/prepare-standalone.mjs

      - name: Compile Electron TypeScript
        run: npx tsc -p electron/tsconfig.json

      - name: Build Electron app
        run: npx electron-builder --config electron-builder.yml --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: warn
