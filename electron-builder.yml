appId: com.brcassistant.app
productName: BRC Assistant
copyright: Copyright 2026

directories:
  output: release
  buildResources: build

# Electron main/preload process files
files:
  - dist-electron/**/*
  - "!node_modules"
  - "!src"
  - "!electron"
  - "!scripts"
  - "!.next"

# The standalone server + assets are placed in resources/
# filter: ["**/*"] explicitly overrides any default exclusions so that
# node_modules (needed by server.js at runtime) is always included.
extraResources:
  - from: .next/standalone
    to: standalone
    filter:
      - "**/*"
  - from: .env.example
    to: .env.example

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.business
  identity: null

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

asar: true
asarUnpack:
  # Unpack native .node binaries — they cannot run from inside the ASAR archive.
  # (pdfjs-dist and @napi-rs are in extraResources, not in the ASAR, so they
  #  do not need asarUnpack entries.)
  - "**/*.node"
